name: Python & Docker CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Flake8
        run: python -m flake8 app.py test_app.py --count --statistics

  tests:
    name: Tests / Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Pytest
        run: python -m pytest -q

  docker:
    name: Docker / Build + runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag qa-ci-smoke:${{ github.sha }} .

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          expected='Hello from Docker! The application is running successfully.'
          actual="$(docker run --rm qa-ci-smoke:${{ github.sha }})"
          test "$actual" = "$expected"

  gate:
    name: CI / Required gate
    if: always()
    needs: [quality, tests, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish CI summary
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        shell: bash
        run: |
          {
            echo '## Python & Docker CI'
            echo
            echo "- Flake8: **${QUALITY_RESULT}**"
            echo "- Pytest: **${TESTS_RESULT}**"
            echo "- Docker build + runtime smoke: **${DOCKER_RESULT}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce aggregate result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$TESTS_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              echo "Required CI dependency finished with result: $result" >&2
              exit 1
            fi
          done
