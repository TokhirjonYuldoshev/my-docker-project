name: Python & Docker CI
run-name: "Python & Docker CI • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild catches mutable base-image/security drift even without repository changes.
    - cron: "30 3 * * 0"

permissions:
  contents: read

concurrency:
  group: python-docker-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality / Flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency integrity
        run: python -m pip check

      - name: Run Flake8
        run: python -m flake8 app.py test_app.py scripts/verify-local.py --count --statistics

  tests:
    name: Tests / Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Pytest
        run: python -m pytest -q --junitxml=reports/pytest.xml

      - name: Upload Pytest JUnit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit-${{ github.run_id }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker / Build + runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag qa-ci-smoke:${{ github.sha }} .

      - name: Run container smoke test
        run: |
          set -euo pipefail
          expected='Hello from Docker! The application is running successfully.'
          actual="$(docker run --rm qa-ci-smoke:${{ github.sha }})"
          test "$actual" = "$expected"

      - name: Verify non-root container configuration
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect qa-ci-smoke:${{ github.sha }} --format '{{.Config.User}}')"
          if [[ -z "$configured_user" || "$configured_user" == '0' || "$configured_user" == 'root' ]]; then
            echo "Container must declare a non-root runtime user; got: ${configured_user:-<empty>}" >&2
            exit 1
          fi
          echo "Verified non-root container user: $configured_user"

  security:
    name: Security / Trivy container scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image for security scan
        run: docker build --tag qa-ci-security:${{ github.sha }} .

      - name: Prepare security evidence directory
        run: mkdir -p reports

      - name: Scan image for fixable critical vulnerabilities
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: qa-ci-security:${{ github.sha }}
          format: json
          output: reports/trivy.json
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          timeout: 5m0s

      - name: Upload Trivy security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-critical-${{ github.run_id }}
          path: reports/trivy.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Trivy evidence summary
        if: ${{ always() }}
        env:
          TRIVY_OUTCOME: ${{ steps.trivy_scan.outcome }}
        run: |
          set -u
          if [[ -s reports/trivy.json ]]; then
            CRITICAL_COUNT="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' reports/trivy.json)"
          else
            CRITICAL_COUNT="unavailable"
          fi
          {
            echo "## Trivy container security evidence"
            echo
            echo "- Scanner outcome: **${TRIVY_OUTCOME:-not-run}**"
            echo "- Policy: fixable CRITICAL vulnerabilities are blocking"
            echo "- Reported CRITICAL findings: **${CRITICAL_COUNT}**"
            echo "- Evidence: \`trivy-critical-${GITHUB_RUN_ID}\` artifact (14 days)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Trivy security result
        if: ${{ always() }}
        env:
          TRIVY_OUTCOME: ${{ steps.trivy_scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "$TRIVY_OUTCOME" != 'success' ]]; then
            echo "Trivy security scan finished with outcome: $TRIVY_OUTCOME" >&2
            exit 1
          fi

  gate:
    name: CI / Required gate
    if: always()
    needs: [quality, tests, docker, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish CI summary
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          if [[ "$QUALITY_RESULT" == success && "$TESTS_RESULT" == success && "$DOCKER_RESULT" == success && "$SECURITY_RESULT" == success ]]; then
            OVERALL="✅ ВСЕ QUALITY GATES ПРОЙДЕНЫ"
            NOTE="Код, dependencies, тесты, Docker runtime и container security подтверждены."
          else
            OVERALL="❌ ЕСТЬ ОШИБКИ В QUALITY GATES"
            NOTE="Один или несколько обязательных сигналов требуют разбора."
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Python & Docker CI — итог
          _QA/DevOps portfolio pipeline • GitHub Actions_

          ## ${OVERALL}
          > ${NOTE}

          | Проверка | Статус |
          | --- | --- |
          | Dependency integrity + Flake8 | $(status_ru "$QUALITY_RESULT") |
          | Pytest + JUnit evidence | $(status_ru "$TESTS_RESULT") |
          | Docker build + runtime smoke + non-root assertion | $(status_ru "$DOCKER_RESULT") |
          | Trivy / fixable CRITICAL | $(status_ru "$SECURITY_RESULT") |

          **Контекст:** `${GITHUB_REPOSITORY}` · `${BRANCH}` · commit `${SHORT_SHA}` · `${GITHUB_EVENT_NAME}`  
          **Run:** [открыть GitHub Actions](${RUN_URL})

          > ✈️ Telegram-уведомление после push в `main`, ручного и weekly scheduled запуска — отдельный observability signal и не подменяет CI result.
          EOF

      - name: Enforce aggregate result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$TESTS_RESULT" "$DOCKER_RESULT" "$SECURITY_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              echo "Required CI dependency finished with result: $result" >&2
              exit 1
            fi
          done

  notify:
    name: Telegram Notification
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [quality, tests, docker, security, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send CI result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; notification skipped."
            {
              echo "## ✈️ Telegram"
              echo
              echo "ℹ️ Уведомление пропущено: добавьте repository secrets TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_ru() {
            case "$1" in
              push) echo "Push в main" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              schedule) echo "Weekly baseline validation" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$GATE_RESULT" == success ]]; then
            HEADER="✅ <b>Python &amp; Docker CI — УСПЕХ</b>"
          else
            HEADER="❌ <b>Python &amp; Docker CI — ТРЕБУЕТ ВНИМАНИЯ</b>"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BRANCH="$(escape_html "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}")"
          REPO="$(escape_html "$GITHUB_REPOSITORY")"
          ACTOR="$(escape_html "$GITHUB_ACTOR")"
          EVENT="$(escape_html "$(event_ru "$GITHUB_EVENT_NAME")")"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          MESSAGE="${HEADER}"
          MESSAGE+=$'\n\n'"📦 <b>Репозиторий:</b> <code>${REPO}</code>"
          MESSAGE+=$'\n'"🌿 <b>Ветка:</b> <code>${BRANCH}</code>"
          MESSAGE+=$'\n'"🔄 <b>Событие:</b> ${EVENT}"
          MESSAGE+=$'\n'"👤 <b>Автор:</b> <code>${ACTOR}</code>"
          MESSAGE+=$'\n'"🔖 <b>Commit:</b> <code>${SHORT_SHA}</code>"
          MESSAGE+=$'\n\n'"🧪 <b>Quality gates</b>"
          MESSAGE+=$'\n'"• Dependency integrity + Flake8: $(status_ru "$QUALITY_RESULT")"
          MESSAGE+=$'\n'"• Pytest: $(status_ru "$TESTS_RESULT")"
          MESSAGE+=$'\n'"• Docker runtime smoke: $(status_ru "$DOCKER_RESULT")"
          MESSAGE+=$'\n'"• Trivy security: $(status_ru "$SECURITY_RESULT")"
          MESSAGE+=$'\n'"• Required gate: $(status_ru "$GATE_RESULT")"
          MESSAGE+=$'\n\n'"🔗 <a href=\"${RUN_URL}\">Открыть GitHub Actions run #${GITHUB_RUN_NUMBER}</a>"

          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /tmp/telegram-response.json \
            --write-out '%{http_code}' \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true)"

          if [[ "$HTTP_CODE" != "200" ]] || ! jq -e '.ok == true' /tmp/telegram-response.json >/dev/null 2>&1; then
            echo "::warning::Telegram sendMessage failed (HTTP ${HTTP_CODE:-transport-error}). CI result is preserved."
            {
              echo "## ✈️ Telegram"
              echo
              echo "⚠️ CI завершён, но Telegram transport не подтвердил доставку."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ✈️ Telegram"
            echo
            echo "✅ Итог CI отправлен в Telegram."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Telegram notification sent."
