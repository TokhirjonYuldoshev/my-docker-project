name: CI/CD pipeline incident
description: Capture a quality, test, container, security, delivery, or observability failure with clear signal ownership and evidence.
title: "[Pipeline incident] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for CI/CD regressions and delivery incidents. Start from the first failing required signal; Telegram is observability and is not the source of truth for build health.

  - type: dropdown
    id: signal
    attributes:
      label: Owning signal
      options:
        - Quality / Flake8
        - Tests / Pytest
        - Docker build / runtime smoke
        - Container security / Trivy
        - CI / Required gate
        - Jenkins delivery / Docker Hub publish
        - GitHub Actions runner/platform
        - Telegram observability only
        - Unknown / needs triage
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - SEV-1 — published image broken or critically vulnerable
        - SEV-2 — required CI/security/runtime gate broken on main
        - SEV-3 — delivery path unavailable while PR validation is healthy
        - SEV-4 — reporting/Telegram presentation or transport issue
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: CI/Jenkins run
      description: Paste a GitHub Actions run URL/ID or Jenkins build identifier when available.
      placeholder: https://github.com/.../actions/runs/... or Jenkins #123

  - type: input
    id: revision
    attributes:
      label: Revision / branch
      placeholder: main @ abc1234
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the first failing stage/job, exit code, assertion, scan result, or delivery error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / invariant
      description: State the quality or delivery contract that should hold.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include relevant logs, JUnit/scan evidence, container output, or platform evidence. Do not paste secrets.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Consistent
        - Intermittent
        - One occurrence
        - Unknown
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Impact and scope
      description: Explain which confidence/delivery path is affected and what remains healthy.
    validations:
      required: true

  - type: checkboxes
    id: discipline
    attributes:
      label: Triage discipline
      options:
        - label: I identified the first failing owning signal rather than only the aggregate/notification result.
          required: true
        - label: I preserved the original failed run and available evidence.
          required: true
        - label: I did not weaken required gates, suppress fixable critical findings, or add arbitrary retry/sleep workarounds.
          required: true
        - label: I did not include credentials, tokens, or registry secrets.
          required: true
