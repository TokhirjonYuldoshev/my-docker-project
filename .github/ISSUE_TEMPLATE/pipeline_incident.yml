name: Инцидент CI/CD-пайплайна
description: Зафиксировать quality, test, container, security, delivery или observability failure с понятным владельцем сигнала и evidence.
title: "[Pipeline incident] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Используйте эту форму для CI/CD regressions и delivery incidents. Начинайте с первого обязательного failing signal; Telegram — observability и не является source of truth для build health.

  - type: dropdown
    id: signal
    attributes:
      label: Владелец сигнала
      options:
        - Quality / Flake8
        - Tests / Pytest
        - Docker build / runtime smoke
        - Container security / Trivy
        - CI / Required gate
        - Jenkins delivery / Docker Hub publish
        - GitHub Actions runner/platform
        - Только Telegram observability
        - Неизвестно / нужен triage
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - SEV-1 — опубликованный image сломан или критически уязвим
        - SEV-2 — required CI/security/runtime gate сломан на main
        - SEV-3 — delivery path недоступен при здоровой PR validation
        - SEV-4 — проблема reporting/Telegram presentation или transport
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: CI/Jenkins run
      description: Укажите GitHub Actions run URL/ID или Jenkins build identifier, если доступен.
      placeholder: https://github.com/.../actions/runs/... или Jenkins #123

  - type: input
    id: revision
    attributes:
      label: Revision / branch
      placeholder: main @ abc1234
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Фактическое поведение
      description: Укажите первый failing stage/job, exit code, assertion, scan result или delivery error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение / инвариант
      description: Опишите quality или delivery contract, который должен выполняться.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Приложите релевантные logs, JUnit/scan evidence, container output или platform evidence. Не вставляйте secrets.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Воспроизводимость
      options:
        - Стабильно воспроизводится
        - Периодически
        - Один случай
        - Неизвестно
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Влияние и область
      description: Объясните, какой confidence/delivery path затронут и что остаётся healthy.
    validations:
      required: true

  - type: checkboxes
    id: discipline
    attributes:
      label: Дисциплина triage
      options:
        - label: Я определил первый failing owning signal, а не только aggregate/notification result.
          required: true
        - label: Я сохранил original failed run и доступное evidence.
          required: true
        - label: Я не ослаблял required gates, не suppress fixable critical findings и не добавлял arbitrary retry/sleep workarounds.
          required: true
        - label: Я не включил credentials, tokens или registry secrets.
          required: true
